name: Build mdBook Docs

permissions:
  contents: write
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -fL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz -o mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run build
        run: ./build.sh

      - name: Debug docs structure
        run: ls -R docs | head -50

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /
