name: Build mdBook Docs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -fL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-linux-amd64 -o mdbook
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run build
        run: ./build.sh
